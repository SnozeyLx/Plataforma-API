on:
  push:
    branches:
      - main
name: 🚀 Deploy RONDA
jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v2

      - name: 📂 Sync files
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PK }}
          SOURCE: "./"
          REMOTE_HOST: "ec2-3-140-18-243.us-east-2.compute.amazonaws.com"
          REMOTE_USER: "ubuntu"
          TARGET: "/var/www/ronda"
          EXCLUDE: "/dist/, /node_modules/"
          SCRIPT_AFTER: |
            cd /var/www/ronda
            composer install
            php artisan migrate
